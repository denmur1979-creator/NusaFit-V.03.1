
name: NusaFit Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  GRADLE_VERSION: "8.13"

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

    - name: Setup Android SDK
  uses: android-actions/setup-android@v3

- name: Install Android SDK packages
  run: |
    sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "ERROR: Android SDK directory is not configured by setup-android"
            exit 1
          fi

          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found under $SDK/cmdline-tools"
            find "$SDK" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi

          echo "Using SDK manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Verify Android SDK
        shell: bash
        run: |
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
          echo "Android SDK 36 is installed."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "${{ env.GRADLE_VERSION }}"

      - name: Configure Firebase (optional)
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.NUSAFIT_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            echo "Firebase config absent; Firebase-backed features may not connect."
          fi

      - name: Configure Google Maps key (optional)
        shell: bash
        env:
          MAPS_API_KEY: ${{ secrets.NUSAFIT_MAPS_API_KEY }}
        run: |
          if [ -n "$MAPS_API_KEY" ]; then
            python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path("app/src/main/res/values/strings.xml")
          p.write_text(p.read_text().replace("YOUR_GOOGLE_MAPS_API_KEY", os.environ["MAPS_API_KEY"].strip()))
          PY
          else
            echo "Maps key absent; Google Maps tiles may not load."
          fi

      - name: Validate Project Files
        shell: bash
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          grep -q 'namespace = "com.nusafit.app"' app/build.gradle.kts
          grep -q 'compileSdk = 36' app/build.gradle.kts
          echo "Project structure and namespace verified."

      - name: Build Release APK
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NusaFit-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
